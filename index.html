<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A33C9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FreshLight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>FreshLight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm lab instrument in your pocket; one clear instruction per screen.
   IDEA: a field scanner's display — big status, the numbers behind it, nothing hidden.
   PICTURE: the live camera view with the measuring boxes drawn on it.
   COLOUR and TYPE: pale ground, ink, violet accent (UV), green/amber/red status; IBM Plex Sans + Mono for numbers.
   LAYOUT: one column, sticky top bar, big bottom action button within thumb reach. */
:root{color-scheme:light dark;
--bg:light-dark(#F5F6F2,#101512);--card:light-dark(#FFFFFF,#18201B);--ink:light-dark(#17211C,#E9EEE9);--mute:light-dark(#4F5B54,#A9B4AD);
--line:light-dark(#D9DDD6,#2C3630);--acc:#4A33C9;--acc2:light-dark(#4A33C9,#9C8BFF);--accbg:light-dark(#EFECFF,#251F4A);
--ok:light-dark(#1E7A4C,#5FD39A);--okbg:light-dark(#DDF0E4,#163325);--warn:light-dark(#8A5300,#F2B24C);--warnbg:light-dark(#FCEFD6,#3A2A0E);
--bad:light-dark(#A3231B,#FF8A80);--badbg:light-dark(#FBE3DE,#3D1714);--soft:light-dark(#E7EAE3,#222B25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--acc);color:#fff}
.bar .brand{font-weight:700;font-size:18px;flex:1}
.bar button{background:none;border:0;color:#fff;font:600 26px/1 system-ui,sans-serif;width:44px;height:44px;border-radius:10px;cursor:pointer}
.bar button:focus-visible{outline:2px solid #fff}
.chip{font:600 12px 'IBM Plex Sans',system-ui,sans-serif;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:28px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
h2{font-size:18px;margin:18px 0 8px}
p{margin:6px 0}.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.kpi b{display:block;font-size:24px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;color:inherit;font:inherit;cursor:pointer;min-height:64px}
.av{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font:600 14px 'IBM Plex Mono';background:var(--badbg);color:var(--bad);flex:none}
.st{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.fresh{background:var(--okbg);color:var(--ok)}.st.soon{background:var(--warnbg);color:var(--warn)}.st.past{background:var(--badbg);color:var(--bad)}.st.day0,.st.changed{background:var(--accbg);color:var(--acc2)}
.demo{font:600 11px 'IBM Plex Sans',system-ui,sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:600 16px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer;padding:0 16px}
.btn.alt{background:var(--card);color:var(--acc2);border:1.5px solid var(--acc2)}.btn.danger{background:var(--card);color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45}.btn:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%)}
.dock .in{max-width:560px;margin:0 auto;display:grid;gap:8px}.two{grid-template-columns:1fr 1fr}
.steps{display:flex;gap:6px;margin:8px 0 4px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--soft)}.steps i.on{background:var(--acc2)}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#0B100D;border-radius:16px;overflow:hidden;margin:10px 0}
.cam video,.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.ov{position:absolute;inset:0;pointer-events:none}
.roi{position:absolute;border:2px dashed #fff;border-radius:4px}.roi.food{border-color:#B9AEFF}.roi.cur{border:3px solid #FFE14D}
.roi.circ{border-radius:50%}
.thumbs.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
input[type=range]{width:100%;accent-color:var(--acc)}
.roi span{position:absolute;left:-2px;top:-22px;font:600 11px 'IBM Plex Sans',system-ui,sans-serif;background:rgba(0,0,0,.65);color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap}
.camMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#E4F1E8;padding:20px;font-size:14px}
.chk{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.chk:last-child{border:0}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}.na{color:var(--mute)}
.big{border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;margin:12px 0}
.big b{font-size:30px;letter-spacing:.02em;display:block;line-height:1.1}
.big.fresh{background:var(--okbg);color:var(--ok)}.big.soon{background:var(--warnbg);color:var(--warn)}.big.past{background:var(--badbg);color:var(--bad)}.big.day0,.big.changed{background:var(--accbg);color:var(--acc2)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--soft);margin:10px 0 4px}.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}.meter s{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
.num{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}
.list li{margin:8px 0}
label.cb{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}label.cb input{width:22px;height:22px}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number],select,textarea{width:100%;font:16px 'IBM Plex Sans',system-ui,sans-serif;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
textarea{min-height:120px;font-family:'IBM Plex Mono';font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer}
.seg button.on{border-color:var(--acc2);background:var(--accbg);color:var(--acc2)}
.note{background:var(--accbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.note.w{background:var(--warnbg)}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumbs img{width:100%;border-radius:10px;display:block;background:#0B100D;aspect-ratio:4/3;object-fit:cover}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.tb{border:0;padding:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;display:grid;gap:4px}.tb span{font-size:12px;color:var(--mute)}
.sheet .in{max-height:92vh;overflow:auto}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:grid;align-items:end}
.sheet .in{background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);max-width:560px;width:100%;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>
</head>
<body>
<header class="bar"><button id="back" aria-label="Back" hidden>‹</button><div class="brand" id="ttl">FreshLight</div><span class="chip" id="mode">Checking camera…</span></header>
<main id="app"></main>
<div class="dock" id="dock"></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<script>
{
const $=s=>document.querySelector(s), app=$('#app'), dock=$('#dock');
const KEY='freshlight-v1';
const FOODS={tomato:{name:'Tomato',code:'T'},strawberry:{name:'Strawberry',code:'S'},other:{name:'Other',code:'P'}};
/* V5 box: fruit circle in the middle; swatches in one column at the side, back to front: black A, gray B, white C, highlighter E */
const ROIS0={food:{x:.42,y:.5,s:.5},A:{x:.86,y:.24,s:.06},B:{x:.86,y:.41,s:.06},C:{x:.86,y:.58,s:.06},E:{x:.86,y:.75,s:.06}};
const ROI_NAME={food:'Fruit circle',A:'Black',B:'Gray',C:'White',E:'Highlighter'};
const MARK_ORDER=['food','A','B','C','E'];
/* The camera looks straight down, so a fruit must be ROLLED (not spun) to show new surface.
   Both fruits: 4 views, rolled a quarter turn (90 degrees) between views.
   Comparison (parent's plan): 2 views half a turn apart = views 1 and 3 of the same scan. */
const VIEW_OPTS={tomato:[1,2,4],strawberry:[1,2,4],other:[1,2,4]};
const VIEW_IDX={tomato:{1:[0],2:[0,2],4:[0,1,2,3]},strawberry:{1:[0],2:[0,2],4:[0,1,2,3]},other:{1:[0],2:[0,2],4:[0,1,2,3]}};
const viewsFor=f=>(S.settings.views&&S.settings.views[f])||4;
const maxViews=f=>Math.max(...VIEW_OPTS[f]);
function viewName(food,k,N){if(N===2)return k===1?'Side 1':'Side 3 (rolled half a turn)';return 'Side '+k}
const clone=o=>JSON.parse(JSON.stringify(o)), sleep=ms=>new Promise(r=>setTimeout(r,ms)), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const nice=s=>pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f2=(v,n=2)=>v==null||isNaN(v)?'—':(+v).toFixed(n);

/* ---------- data ---------- */
function demoItems(){
  const mk=(id,label,food,ago,pts)=>{const d0=addDays(today(),-ago),b=food==='tomato'?{glow:.42,look:.95}:{glow:.31,look:.62};
    return {id,label,food,demo:true,day0:ds(d0),scans:pts.map(([day,g,l])=>({date:ds(addDays(d0,day)),day,glow:b.glow*(1+g/100),look:b.look*(1+l/100),sides:[]}))}};
  return [mk('d1','T1','tomato',6,[[0,0,0],[1,1.5,-.5],[2,3,-1],[3,5,-1.5],[4,7,-2.5],[5,9,-3],[6,12,-4]]),
          mk('d2','S1','strawberry',2,[[0,0,0],[1,2,-1],[2,4,-2]]),
          mk('d3','S2','strawberry',4,[[0,0,0],[1,4,-2],[2,9,-4],[3,15,-7],[4,21,-10]]),
          mk('d4','T2','tomato',1,[[0,0,0],[1,1,-.5]])];
}
const ERR0={tomato:{glow:6,look:3},strawberry:{glow:8,look:4},other:{glow:8,look:4}};
function fresh(){return {v:4,settings:{cameraId:'',presets:{},rois:clone(ROIS0),err:clone(ERR0),errSource:{},lead:{tomato:3,strawberry:2},views:{tomato:4,strawberry:4,other:4},viewsV:2,baseE:null,setupDone:false,photoMode:'research',keepFull:false},items:demoItems(),tests:[]}}
function migrate(j){ /* v1/v2 data -> v4: new names, highlighter instead of copy paper, measuring error instead of 3xCV */
  if(j.v===4)return j;
  if(j.v===3){const s=j.settings||{};Object.keys(s).forEach(k=>{if(/^wo[b]/.test(k)){s[k.replace(/^wo[b][a-z]*/,'err')]=s[k];delete s[k]}});j.v=4;return j}
  const s=j.settings||{};s.rois=clone(ROIS0);s.err=clone(ERR0);s.errSource={};s.sides=4;s.baseE=null;s.setupDone=false;delete s.noise;delete s.baseD;
  (j.items||[]).forEach(it=>it.scans.forEach(sc=>{if(sc.glow==null){sc.glow=sc.uv;sc.look=sc.color;sc.sides=[];sc.old=true}}));
  j.tests=[];j.v=4;j.migrated=true;return j}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.settings)return migrate(j)}catch(e){}return fresh()}
let S=load();if(!S.settings.views||S.settings.viewsV!==2){S.settings.views={tomato:4,strawberry:4,other:4};S.settings.viewsV=2;delete S.settings.sides}if(!S.settings.photoMode)S.settings.photoMode='research';if(S.settings.keepFull==null)S.settings.keepFull=false;if(!S.tests)S.tests=[];let lastCap=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* FreshIndex: is the change since Day 0 bigger than the measuring error? (change ÷ measuring error, averaged over UV glow and white-light brightness) */
function evalItem(it){
  const W0=S.settings.err[it.food]||S.settings.err.other,W={glow:Math.max(.5,W0.glow),look:Math.max(.5,W0.look)}, L=S.settings.lead[it.food], b=it.scans[0];let det=null;
  const two=sc=>sc.sides&&sc.sides.length>=3?{g:(sc.sides[0].glow+sc.sides[2].glow)/2,l:(sc.sides[0].look+sc.sides[2].look)/2}:null;
  const W2b=((S.settings.errBy||{})[it.food]||{})[2],W2=W2b?{glow:Math.max(.5,W2b.glow),look:Math.max(.5,W2b.look)}:W,b2=two(b);
  it.scans.forEach((sc,i)=>{sc.dG=(sc.glow-b.glow)/b.glow*100;sc.dL=(sc.look-b.look)/b.look*100;sc.wG=Math.abs(sc.dG)/W.glow;sc.wL=Math.abs(sc.dL)/W.look;sc.fs=(sc.wG+sc.wL)/2;if(det===null&&i>0&&sc.fs>=1)det=sc.day;
    const t=two(sc);sc.fs2=(t&&b2)?(Math.abs((t.g-b2.g)/b2.g*100)/W2.glow+Math.abs((t.l-b2.l)/b2.l*100)/W2.look)/2:null});
  const last=it.scans[it.scans.length-1];let status,label,detail,left=null;
  if(it.scans.length===1){status='day0';label='Day 0 saved';detail='Scan again tomorrow to see a change'}
  else if(det===null){status='fresh';label='Fresh';detail='The change is still smaller than the measuring error'}
  else if(L==null){status='changed';label='Changed';detail='Real change since Day '+det+'. No days-left prediction for this food yet'}
  else{left=L-(last.day-det);if(left<=0){status='past';label='Past best';detail='Use today or compost'}else{status='soon';label='Use soon';detail='About '+left+' day'+(left>1?'s':'')+' left · changing since Day '+det}}
  return {status,label,detail,left,det,last,W,W2,W2set:!!W2b,L};
}

/* ---------- camera ---------- */
const cam={track:null,caps:{},mode:'unknown',err:''};
const box=document.createElement('div');box.className='cam';
box.innerHTML='<video playsinline muted autoplay></video><img alt="Captured photo" hidden><div class="ov"></div><div class="camMsg"></div>';
const video=box.querySelector('video'),still=box.querySelector('img'),ov=box.querySelector('.ov'),msg=box.querySelector('.camMsg');
let curRoi=null,frameWH=[4,3];
function fitBox(w,h){if(w&&h){frameWH=[w,h];box.style.aspectRatio=w+'/'+h}drawOv()}
function drawOv(){const R=S.settings.rois,[W,H]=frameWH;ov.innerHTML=MARK_ORDER.map(k=>{const r=R[k],hw=r.s/2,hh=r.s/2*W/H;
  return `<div class="roi ${k==='food'?'food circ':''} ${curRoi===k?'cur':''}" style="left:${(r.x-hw)*100}%;top:${(r.y-hh)*100}%;width:${r.s*100}%;height:${r.s*W/H*100}%"><span>${ROI_NAME[k]}</span></div>`}).join('')}
box.addEventListener('click',e=>{if(!curRoi)return;const b=box.getBoundingClientRect();const r=S.settings.rois[curRoi];r.x=clamp((e.clientX-b.left)/b.width,.02,.98);r.y=clamp((e.clientY-b.top)/b.height,.02,.98);save();drawOv();if(onMark)onMark()});
let onMark=null;
function stopCam(){if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}cam.track=null}
async function startCam(retry){
  msg.textContent='Starting camera…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){cam.mode='photo';cam.err='Live camera not available here';setMode();msg.textContent='';return false}
  try{stopCam();const id=S.settings.cameraId;const c={audio:false,video:{width:{ideal:1920},height:{ideal:1440}}};
    if(id)c.video.deviceId={exact:id};else c.video.facingMode={ideal:'environment'};
    const st=await navigator.mediaDevices.getUserMedia(c);cam.track=st.getVideoTracks()[0];cam.caps=cam.track.getCapabilities?cam.track.getCapabilities():{};
    video.srcObject=st;video.hidden=false;still.hidden=true;await video.play().catch(()=>{});
    await new Promise(r=>{if(video.videoWidth)return r();video.onloadedmetadata=r;setTimeout(r,2500)});
    cam.mode='live';msg.textContent='';fitBox(video.videoWidth,video.videoHeight);setMode();return true}
  catch(e){if(S.settings.cameraId&&!retry){S.settings.cameraId='';save();return startCam(true)}
    cam.mode='photo';cam.err=e.name==='NotAllowedError'?'Camera permission was blocked':'Live camera not available here';msg.textContent='';setMode();return false}
}
async function backCams(){try{const d=await navigator.mediaDevices.enumerateDevices();return d.filter(x=>x.kind==='videoinput')}catch(e){return[]}}
function setMode(){const m=$('#mode');m.textContent=cam.mode==='live'?'Live camera':cam.mode==='photo'?'Photo mode':'';m.hidden=!m.textContent}
const lum=a=>(a[0]+a[1]+a[2])/3;   /* gray value = average of red, green and blue (0-255), like ImageJ's unweighted gray */
/* swatches: average color inside each small square */
function measureSwatches(ctx,W,H){const out={},R=S.settings.rois;for(const k of ['A','B','C','E']){const r=R[k],half=Math.max(2,Math.round(r.s*W/2)),cx=Math.round(r.x*W),cy=Math.round(r.y*H);
  const x0=clamp(cx-half,0,W-2),y0=clamp(cy-half,0,H-2),w=Math.max(1,Math.min(2*half,W-x0)),h=Math.max(1,Math.min(2*half,H-y0));
  const d=ctx.getImageData(x0,y0,w,h).data;let a=0,g=0,b=0,mx=0;const n=d.length/4;for(let i=0;i<d.length;i+=4){a+=d[i];g+=d[i+1];b+=d[i+2];const m=Math.max(d[i],d[i+1],d[i+2]);if(m>mx)mx=m}
  out[k]=[a/n,g/n,b/n];out[k+'max']=mx}return out}
/* fruit circle: a small copy of the fruit area (about 200 px across), so the whole fruit can be measured pixel by pixel */
const DS=200;const small=document.createElement('canvas');const sctx=small.getContext('2d',{willReadFrequently:true});
function fruitRect(W,H){const r=S.settings.rois.food,d=Math.round(r.s*W),x0=clamp(Math.round(r.x*W-d/2),0,W-2),y0=clamp(Math.round(r.y*H-d/2),0,H-2);return {x0,y0,w:Math.min(d,W-x0),h:Math.min(d,H-y0)}}
function fruitPixels(src,W,H){const fr=fruitRect(W,H),sc=Math.min(1,DS/Math.max(fr.w,fr.h)),w=Math.max(8,Math.round(fr.w*sc)),h=Math.max(8,Math.round(fr.h*sc));
  small.width=w;small.height=h;sctx.drawImage(src,fr.x0,fr.y0,fr.w,fr.h,0,0,w,h);return {w,h,d:sctx.getImageData(0,0,w,h).data}}
function thumbOf(cv){const t=document.createElement('canvas');t.width=320;t.height=Math.round(320*cv.height/cv.width);t.getContext('2d').drawImage(cv,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}

/* ---------- how it works (plain words for judges) ---------- */
function vHow(){
  app.innerHTML=`<h1>How FreshLight decides</h1>
  <div class="card"><b>1. Look at the whole fruit</b><p class="small">The camera looks straight down, so it only sees the top of the fruit. The fruit lies on its side and is <b>rolled a quarter turn</b> between photos, like a wheel or a pencil, so the camera sees all of it: 4 sides. (Spinning it in place would show the same top again.)</p></div>
  <div class="card"><b>2. Measure brightness</b><p class="small">In each photo the app finds the fruit and takes its <b>gray value</b>: its average brightness, from 0 (black) to 255 (white). It leaves out shiny glare spots and the green top.</p>
   <p class="small"><b>UV glow</b> = fruit brightness in the UV photo ÷ highlighter brightness<br><b>White-light brightness</b> = fruit brightness in the white photo ÷ gray card brightness</p><p class="small mute">Dividing by a card that never changes makes it fair: if the light is a little weaker today, both get darker together.</p></div>
  <div class="card"><b>3. Average the 4 sides</b><p class="small">Today's number = the 4 sides added up, divided by 4.</p></div>
  <div class="card"><b>4. Percent change since Day 0</b><p class="small">(today − Day 0) ÷ Day 0 × 100</p></div>
  <div class="card"><b>5. Measuring error</b><p class="small">Take the same fruit out and put it back 5 times. The numbers change a little even though the fruit did not. That is the measuring error: (biggest − smallest) ÷ average × 100.</p></div>
  <div class="card"><b>6. FreshIndex: is the change bigger than the measuring error?</b><p class="small">For UV glow and for white-light brightness: change ÷ measuring error. FreshIndex = the average of the two.</p><p class="small">Below 1: <b>Fresh</b> (the change is smaller than the error, so we can't tell it changed). 1 or more: <b>Use soon</b> (a real change). Then, after the usual number of days (learned from the first batch): <b>Past best</b>.</p></div>
  <div class="card"><b>7. Two ways, compared</b><p class="small">The app also works out everything using only sides 1 and 3 (half a turn apart), to test whether 4 sides really are better than 2.</p></div>
  <p class="small mute">A freshness screen, not a food-safety test.</p>`;setDock('')}

function repHtml(r){return [['Exposure',r.exposure],['ISO',r.iso],['White balance',r.wb],['Focus',r.focus]].map(([a,b])=>`<div class="chk"><span>${a}</span><span class="${/^Locked/.test(b)?'pass':'na'}">${esc(b)}</span></div>`).join('')}

/* ---------- new item ---------- */

  <label class="f">Food</label><div class="seg">${Object.keys(FOODS).map(k=>`<button data-f="${k}" class="${k===food?'on':''}">${FOODS[k].name}</button>`).join('')}</div>
  ${food==='other'?'<div class="note w small">Untested food: the app will show change since Day 0, but no days-left prediction.</div>':''}

/* ---------- scan: place, then for each side a UV photo and a white photo ---------- */
const placeText=food=>food==='strawberry'?'Lay it <b>on its side</b> in the middle of the circle, <b>tip pointing at the door mark</b>, green top toward the back. Don\'t try to stand it up.':food==='tomato'?'Lay it <b>on its side</b> in the middle of the circle, <b>stem pointing at the door mark</b>. (The camera sees the sides of the tomato, all the way around.)':'Put it in the middle of the circle.';
const turnText=(food,k,N)=>{const what=food==='tomato'?'stem':'tip',like=food==='tomato'?'like rolling a wheel':'like rolling a pencil';
  return N===2?`<b>Roll it half a turn</b>, ${like}, so the side that was on the floor is now on top. ${food==='tomato'?'Stem':'Tip'} still pointing at the door. (Spinning it in place would not help: the camera would see the same top again.)`
   :`<b>Roll it a quarter turn</b>, ${like}, ${what} still pointing at the door. (Spinning it in place would not help: the camera would see the same top again.) Let it settle; if it rolls back or tips, nudge it once, otherwise leave it where it rests.`};
function vScan(){
  const W=ctx.putback?S.tests.find(t=>t.id===ctx.putback):null;
  const it=ctx.id?S.items.find(i=>i.id===ctx.id):null,food=W?W.food:it?it.food:ctx.newItem.food,label=W?W.label:it?it.label:ctx.newItem.label;wake();
  const N=W?maxViews(food):viewsFor(food),ticks=Array.from({length:N},(_,i)=>i+1);ctx.sides=ctx.sides||[];ctx.step=ctx.step||0;
  const sub=W?`Put-back test · round ${W.rounds.length+1}`:it?'Day '+dayDiff(it.day0,ds(today())):'Day 0';
  const head=`${stepBar(Math.min(ctx.step+1,N+1),N+1)}<p class="small mute">${esc(label)} · ${FOODS[food].name} · ${sub}</p>`;
  if(ctx.step===0){
    app.innerHTML=`${head}<h1>Place the fruit</h1><p>Lights off. Open the door and ${placeText(food)}</p>${W?'<div class="note small">Put-back test: take the fruit all the way out of the box first, then put it back in, as you would on a normal day.</div>':''}<div data-cam></div>`;
    mountCam();if(cam.mode!=='photo'&&!cam.track)startCam();
    setDock(`<button class="btn" id="n">Fruit is in, door closed</button>`);on('n',()=>{ctx.step=1;ctx.part=null;vScan()});return;
  }
  if(ctx.step<=N){
    const si=ctx.step,tick=ticks[si-1],cur=ctx.cur||(ctx.cur={});const first=si%2===1?'uv':'white',second=first==='uv'?'white':'uv';
    const need=!cur[first]?first:!cur[second]?second:null;
    if(need){const isUV=need==='uv';
      app.innerHTML=`${head}<h1>Side ${si} of ${N}</h1><p class="small mute">${viewName(food,si,N)}</p><p>${isUV?'Flip the switch to <b>UV</b>.':'Flip the switch to <b>WHITE</b>.'} Don't touch the phone or the fruit while it captures.</p>${si===1&&!cur[first]?'<p class="small mute">The app alternates UV-first and white-first so you flip the switch less.</p>':''}<div data-cam></div><div id="res"></div>`;
      mountCam();if(cam.mode==='live')applyPreset((S.settings.presets[need]||{}).p);
      setDock(`<button class="btn" id="cap">${cam.mode==='live'?(isUV?'Capture UV':'Capture white'):(isUV?'Take UV photo':'Take white photo')}</button>`);
      on('cap',async()=>{const b=$('#cap');b.disabled=true;let g;
        if(cam.mode==='live'){b.textContent='Hold still…';b.classList.add('pulse');await applyPreset((S.settings.presets[need]||{}).p);await sleep(700);g=await grab(8)}else g=await pickPhoto();
        b.classList.remove('pulse');b.disabled=false;if(!g){b.textContent='Try again';return}
        const checks=isUV?uvChecks(g):whiteChecks(g);
        $('#res').innerHTML=`<div class="card">${chkHtml(checks)}</div>${checks.some(c=>c[1]===false)?'<p class="small" style="color:var(--bad)">Something looks off. Fix it and capture again, or keep it.</p>':''}`;
        setDock(`<button class="btn alt" id="cap2">Capture again</button><button class="btn" id="keep">Keep</button>`,true);
        on('cap2',()=>vScan());on('keep',()=>{cur[need]=g;cur[need+'Checks']=checks;vScan()})});
      return}
    /* both photos of this side are in: measure */
    const sn=sideNumbers(food,cur.uv,cur.white),ok=sn.n>=40;cur.sn=sn;
    app.innerHTML=`${head}<h1>Side ${si} measured</h1><div class="thumbs"><img src="${sn.preview}" alt="Fruit pixels used (bright) and left out (dark)"><img src="${cur.uv.thumb}" alt="UV photo"></div>
     <p class="small mute">Left: only the colored part was measured. Glare, the green top, the rim and the floor are grayed out.</p>
     <div class="card"><div class="chk"><span>Fruit found</span><span class="${ok?'pass':'fail'}">${ok?sn.n+' points':'Not found'}</span></div><div class="chk"><span>UV glow (fruit ÷ highlighter)</span><span class="num">${f2(sn.glow,4)}</span></div><div class="chk"><span>White-light brightness (fruit ÷ gray swatch)</span><span class="num">${f2(sn.look,4)}</span></div></div>
     ${si<N?`<div class="note">${turnText(food,si+1,N)}</div>`:'<div class="note">Last side done. Lights off.</div>'}`;
    setDock(`<button class="btn alt" id="redo">Redo this side</button><button class="btn" id="n">${si<N?'Rolled it · next side':'Finish'}</button>`,true);
    on('redo',()=>{ctx.cur={};vScan()});
    on('n',()=>{ctx.sides.push({tick,uv:cur.uv,white:cur.white,sn,checks:[...(cur.uvChecks||[]),...(cur.whiteChecks||[])]});ctx.cur={};ctx.step++;if(ctx.step>N)finishScan(W,it,food);else vScan()});
    return;
  }
}
async function finishScan(W,it,food){
  app.innerHTML='<h1>Saving…</h1>';setDock('');
  const sides=ctx.sides,glow=avg(sides.map(s=>s.sn.glow)),look=avg(sides.map(s=>s.sn.look));
  const date=ds(today()),time=new Date().toTimeString().slice(0,5);
  const sec={greenShare:avg(sides.map(s=>{const c=s.sn.uvRGB,t=c[0]+c[1]+c[2]||1;return c[1]/t})),blueDivE:avg(sides.map(s=>s.sn.uvRGB[2]/Math.max(1,s.uv.m.E[1]))),
    rg:avg(sides.map(s=>(s.sn.wRGB[0]/Math.max(1,s.sn.Bw[0]))/(Math.max(1,s.sn.wRGB[1])/Math.max(1,s.sn.Bw[1]))))};
  const allCk=sides.flatMap(s=>s.checks),checks=sides.map((s,i)=>'side'+(i+1)+': '+s.checks.map(([t,o])=>t+' '+(o===null?'n/a':o?'pass':'check')).join('; ')).join(' | ');
  const sideRows=sides.map((s,i)=>({tick:s.tick,view:viewName(food,i+1,sides.length),glow:s.sn.glow,look:s.sn.look,fruitUV:s.sn.fruitUV,fruitW:s.sn.fruitW,E:s.sn.E,B:s.sn.B,n:s.sn.n}));
  let item=it,prefix,day;
  if(W){prefix='PutBack_'+safe(W.label)+'_R'+(W.rounds.length+1);day=0}
  else{if(!item){item={id:'i'+Date.now(),label:ctx.newItem.label,food,demo:false,day0:date,scans:[]};S.items.push(item)}day=dayDiff(item.day0,date);prefix='Day'+pad(day)+'_'+safe(item.label)}
  const keep=S.settings.photoMode==='research'||S.settings.keepFull||!!W,taken=new Set((await allPhotos()).map(p=>p.name.replace(/\.\w+$/,''))),names=[],recs=[],ownerId=W?'pb_'+W.id:item.id;
  sides.forEach((s,i)=>{for(const [k,kind] of [['uv','UV'],['white','W']]){const g=s[k];let base=prefix+'_S'+(i+1)+'_'+kind,nm=base,j=2;while(taken.has(nm))nm=base+'_'+(j++);taken.add(nm);nm+='.'+extOf(g.blob);names.push(nm);
    const isUV=k==='uv';recs.push({id:ownerId+'|'+nm,itemId:ownerId,label:W?W.label:item.label,food,date,day,side:i+1,kind,name:nm,blob:keep?g.blob:null,size:g.blob.size,thumb:g.thumb,exported:false,
      meta:{time,cameraMode:cam.mode,settings:cam.mode==='live'&&S.settings.presets[k]?S.settings.presets[k].rep:null,fruitGray:isUV?s.sn.fruitUV:s.sn.fruitW,swatchGray:isUV?s.sn.E:s.sn.B,value:isUV?s.sn.glow:s.sn.look,n:s.sn.n,checks:s.checks.map(([t,o])=>t+' '+(o===null?'n/a':o?'pass':'check')).join('; ')}})}});
  const okSave=await putPhotos(recs);
  if(S.settings.photoMode==='research'){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  if(W){W.rounds.push({date,time,sides:sideRows,glow,look,photos:names});save();stack=[['home',{}]];go('putback',{id:W.id,justDone:true},false);return}
  item.scans.push({date,day,glow,look,sides:sideRows,sec,time,photos:names,checks});save();
  lastCap={itemId:item.id,sides,names,okSave,keep};
  stack=[['home',{}]];go('result',{id:item.id,checks:allCk},false)}

  ${(()=>{const c=lastCap&&lastCap.itemId===it.id?lastCap:null;if(!c)return'';return `<div class="card"><b>Photos</b><div class="thumbs" style="margin-top:8px">${c.sides.map(s=>`<img src="${s.sn.preview}" alt="Measured fruit area">`).join('')}</div>

  <div class="card"><table><thead><tr><th>Day</th><th>UV change</th><th>White change</th><th>FreshIndex</th><th>2 sides</th></tr></thead><tbody>${it.scans.map(s=>`<tr><td>${s.day} · ${nice(s.date)}${s.old?' *':''}</td><td class="num">${s.dG.toFixed(1)}%</td><td class="num">${s.dL.toFixed(1)}%</td><td class="num">${s.fs.toFixed(2)}</td><td class="num">${s.fs2!=null?s.fs2.toFixed(2):'—'}</td></tr>`).join('')}</tbody></table>${it.scans.some(s=>s.old)?'<p class="small mute">* measured with the old box and method</p>':''}</div>
  ${e.det!=null?`<div class="card"><div class="chk"><span>First real change</span><b>Day ${e.det}</b></div>${e.L!=null?`<div class="chk"><span>Predicted past best</span><b>Day ${e.det+e.L}</b></div>`:''}</div>`:''}
  <div class="card"><b>Photos</b><div id="ph" class="small mute" style="margin-top:6px">Loading…</div></div>
  <button class="btn danger" id="del" style="margin-top:8px">Delete this item</button>`;
  (async()=>{const ph=(await allPhotos()).filter(p=>p.itemId===it.id).sort((a,b)=>a.name<b.name?-1:1),el=$('#ph');if(!el)return;
    if(!ph.length){el.textContent=it.demo?'Example items have no photos.':'No photos saved for this item.';return}
    const by={};ph.forEach(p=>{const k=p.date+'|'+p.day;(by[k]=by[k]||[]).push(p)});el.className='';
    el.innerHTML=Object.keys(by).sort().map(d=>{const g=by[d];return `<div style="margin:10px 0"><div class="small mute">Day ${g[0].day} · ${nice(g[0].date)}${g[0].meta&&g[0].meta.time?' · '+g[0].meta.time:''} · ${g.length} photos</div><div class="thumbs t4" style="margin-top:4px">${g.map(p=>`<button class="tb" data-id="${esc(p.id)}" aria-label="Open ${esc(p.name)}"><img src="${p.thumb}" alt=""><span>${p.side?'S'+p.side+' ':''}${p.kind==='UV'?'UV':'White'}${p.blob?'':' · preview'}</span></button>`).join('')}</div></div>`}).join('');
    el.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{const p=ph.find(x=>x.id===b.dataset.id),url=p.blob?URL.createObjectURL(p.blob):p.thumb;
      sheet(`<h2>${esc(p.name)}</h2><img src="${url}" alt="${esc(p.name)}" style="width:100%;border-radius:12px"><p class="small mute">${p.blob?fmtMB(p.size)+' · '+(p.exported?'exported':'not exported yet'):'Preview only: the full photo was not kept'}</p>${p.blob?'<button class="btn" id="sv">Save this photo</button>':''}<p class="small" id="svm"></p><button class="btn alt" id="cl" style="margin-top:8px">Close</button>`,
        (d,close)=>{const s=d.querySelector('#sv');if(s)s.onclick=async()=>{const r=await saveFile(p.blob,p.name);d.querySelector('#svm').textContent=r==='downloaded'?'Saved to Downloads.':r==='shared'?'Shared.':r==='cancelled'?'':'Saving is blocked here; it works in the installed app.'};d.querySelector('#cl').onclick=close})})})();
  const svg=$('#fig svg'),draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;const p=[34,12,24,10],mx=Math.max(1.6,...it.scans.map(s=>s.fs))*1.1,maxD=Math.max(1,...it.scans.map(s=>s.day));
    const X=d=>p[0]+(W-p[0]-p[1])*d/maxD,Y=v=>H-p[2]-(H-p[2]-p[3])*v/mx;
    svg.innerHTML=`<line x1="${p[0]}" x2="${W-p[1]}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${p[0]}" x2="${W-p[1]}" y1="${Y(1)}" y2="${Y(1)}" stroke="var(--warn)" stroke-dasharray="5 4"/><text x="${p[0]+4}" y="${Y(1)-6}" fill="var(--warn)" font-size="11">1 = as big as the measuring error</text><text x="${p[0]-6}" y="${Y(0)+4}" text-anchor="end" font-size="11" fill="var(--mute)">0</text><text x="${p[0]-6}" y="${Y(1)+4}" text-anchor="end" font-size="11" fill="var(--mute)">1</text>
    <polyline fill="none" stroke="var(--acc2)" stroke-width="2.5" stroke-linejoin="round" points="${it.scans.map(s=>X(s.day)+','+Y(s.fs)).join(' ')}"/>${it.scans.map(s=>`<circle cx="${X(s.day)}" cy="${Y(s.fs)}" r="4.5" fill="${s.fs>=1?'var(--warn)':'var(--acc2)'}"/>`).join('')}
    ${it.scans.filter((s,i,a)=>W>420||i%Math.ceil(a.length/6)===0||i===a.length-1).map(s=>`<text x="${X(s.day)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mute)">D${s.day}</text>`).join('')}`};
  new ResizeObserver(draw).observe(svg);draw();
  on('del',()=>sheet(`<h2>Delete ${esc(it.label)}?</h2><p class="mute">Its history and photos will be removed from this phone. Export them first if you need them.</p><div class="grid2"><button class="btn alt" id="no">Cancel</button><button class="btn danger" id="yes">Delete</button></div>`,(d,close)=>{d.querySelector('#no').onclick=close;d.querySelector('#yes').onclick=async()=>{const ids=(await allPhotos()).filter(p=>p.itemId===it.id).map(p=>p.id);await delPhotos(ids);S.items=S.items.filter(i=>i!==it);save();close();stack=[];go('home',{},false)}}));
  setDock(`<button class="btn" id="sc">Scan ${esc(it.label)} now</button>`);on('sc',()=>S.settings.setupDone?go('scan',{id:it.id,step:0}):go('setup',{step:1}));
}

/* ---------- put-back test: same fruit, out and back in, 5 times ---------- */
const range=a=>a.length?(Math.max(...a)-Math.min(...a))/avg(a)*100:null;
function errorOf(t){const R=t.rounds;
  const res={};const sets=VIEW_IDX[t.food];
  for(const k of VIEW_OPTS[t.food]){const idx=sets[k];if(!R.length||R.some(r=>r.sides.length<idx[idx.length-1]+1)){res[k]=null;continue}
    const g=R.map(r=>avg(idx.map(i=>r.sides[i].glow))),l=R.map(r=>avg(idx.map(i=>r.sides[i].look)));res[k]={glow:range(g),look:range(l)}}
  return res}
function vPutBack(){
  const t=ctx.id?S.tests.find(x=>x.id===ctx.id):null;
  if(!t){
    const food=ctx.food||'tomato';
    app.innerHTML=`<h1>Put-back test</h1><p class="mute">Finds your <b>measuring error</b>: how much the numbers change when nothing has really changed. Take the same fruit all the way out and put it back in, 5 times, with a full 4-side scan each time. Do it on one day, with one fresh fruit of each kind.</p>
    ${S.tests.length?`<h2>Earlier tests</h2>${S.tests.map(x=>`<button class="item" data-t="${x.id}"><span class="av">${esc(x.label.slice(0,3))}</span><span class="grow"><b>${FOODS[x.food].name}</b><br><span class="small mute">${nice(x.date)} · ${x.rounds.length} of 5 rounds</span></span></button>`).join('')}`:''}
    <h2>New test</h2><label class="f">Food</label><div class="seg">${['tomato','strawberry'].map(k=>`<button data-f="${k}" class="${k===food?'on':''}">${FOODS[k].name}</button>`).join('')}</div>
    <label class="f" for="wl">Label</label><input type="text" id="wl" maxlength="8" value="P${FOODS[food].code}${S.tests.filter(x=>x.food===food).length+1}">
`;
    app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ctx.food=b.dataset.f;vPutBack()});
    app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go('putback',{id:b.dataset.t}));
    setDock(`<button class="btn" id="st">Start round 1</button>`);
    on('st',()=>{if(!S.settings.setupDone)return go('setup',{step:1});const x={id:'w'+Date.now(),food,label:($('#wl').value||'').trim()||'P1',date:ds(today()),rounds:[]};S.tests.push(x);save();go('scan',{putback:x.id,step:0})});return}
  const w=errorOf(t),n=t.rounds.length;
  app.innerHTML=`<h1>Put-back test · ${esc(t.label)}</h1><p class="mute">${FOODS[t.food].name} · ${nice(t.date)} · ${n} of 5 rounds</p>
  ${ctx.justDone&&n<5?`<div class="note">Round ${n} saved. Take the fruit <b>all the way out</b>, then start round ${n+1}.</div>`:''}
  <div class="card"><b>Each round (average of the sides)</b><table><thead><tr><th>Round</th><th>UV glow</th><th>White light</th></tr></thead><tbody>${t.rounds.map((r,i)=>`<tr><td>${i+1} · ${r.time}</td><td class="num">${r.glow.toFixed(4)}</td><td class="num">${r.look.toFixed(4)}</td></tr>`).join('')||'<tr><td colspan="3" class="mute">No rounds yet</td></tr>'}</tbody></table></div>
  ${n>=3?`<div class="card"><b>Measuring error = (biggest − smallest) ÷ average × 100</b><table><thead><tr><th>Using</th><th>UV error</th><th>White error</th></tr></thead><tbody>${VIEW_OPTS[t.food].map(k=>w[k]?`<tr><td>${k===1?'Side 1 only':k===2?'2 sides, half a turn apart (1 and 3)':'All 4 sides (quarter turns)'}</td><td class="num">${w[k].glow.toFixed(1)}%</td><td class="num">${w[k].look.toFixed(1)}%</td></tr>`:'').join('')}</tbody></table>
   <p class="small mute">Smaller is better. Any error below 0.5% is counted as 0.5%, so one lucky test can't make the method look better than it is. If 4 sides give a smaller error than 2, looking at more of the fruit is proven to help. If 2 sides are about as good, they save time. Decide before the real experiment and write it down.</p>
   ${n<5?'<p class="small" style="color:var(--warn)">Finish all 5 rounds before using these numbers.</p>':''}
   ${n>=5?`<label class="f">Use for ${FOODS[t.food].name}</label><div class="seg">${VIEW_OPTS[t.food].filter(k=>w[k]).map(k=>`<button data-use="${k}">${k} side${k>1?'s':''}</button>`).join('')}</div>`:''}</div>`:'<p class="small mute">Measuring errors appear after 3 rounds; 5 are needed.</p>'}
  ${S.settings.errSource[t.food]?`<p class="small mute">Now using: ${esc(S.settings.errSource[t.food])}</p>`:''}`;
  app.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const k=+b.dataset.use,v=w[k];if(n<5)return;S.settings.err[t.food]={glow:Math.max(.5,+v.glow.toFixed(1)),look:Math.max(.5,+v.look.toFixed(1))};S.settings.errBy=S.settings.errBy||{};S.settings.errBy[t.food]={};[1,2,4].forEach(q=>{if(w[q])S.settings.errBy[t.food][q]={glow:+w[q].glow.toFixed(1),look:+w[q].look.toFixed(1)}});S.settings.views[t.food]=k;S.settings.errSource[t.food]=`${t.label}, ${n} rounds, ${k} side${k>1?'s':''} (${nice(t.date)})`;save();vPutBack()});
  setDock(n<5?`<button class="btn" id="nx">Start round ${n+1}</button>`:`<button class="btn" id="hm">Done</button>`);
  on('nx',()=>go('scan',{putback:t.id,step:0}));on('hm',()=>{stack=[];go('home',{},false)});
}

/* ---------- data ---------- */
function csv(){const r=[['label','food','example','date','day','sides','uv_glow','white_brightness','uv_glow_change_pct','white_change_pct','freshindex','uv_glow_s1','uv_glow_s2','uv_glow_s3','uv_glow_s4','white_s1','white_s2','white_s3','white_s4','uv_glow_2sides_s1s3','white_2sides_s1s3','freshindex_2sides','sec_tomato_green_share','sec_strawberry_blue_div_highlighter','sec_red_div_green','time','photos','checks']];
  S.items.forEach(it=>{evalItem(it);it.scans.forEach(s=>{const sd=s.sides||[],g=i=>sd[i]?sd[i].glow.toFixed(5):'',l=i=>sd[i]?sd[i].look.toFixed(5):'',sc=s.sec||{};
    r.push([cell(it.label),it.food,it.demo?1:0,s.date,s.day,sd.length,s.glow.toFixed(5),s.look.toFixed(5),s.dG.toFixed(2),s.dL.toFixed(2),s.fs.toFixed(3),g(0),g(1),g(2),g(3),l(0),l(1),l(2),l(3),sd.length>=3?((sd[0].glow+sd[2].glow)/2).toFixed(5):'',sd.length>=3?((sd[0].look+sd[2].look)/2).toFixed(5):'',s.fs2!=null?s.fs2.toFixed(3):'',sc.greenShare!=null?sc.greenShare.toFixed(5):'',sc.blueDivE!=null?sc.blueDivE.toFixed(5):'',sc.rg!=null?sc.rg.toFixed(5):'',cell(s.time||''),cell((s.photos||[]).join(' ')),cell(s.checks||'')])})});return r.map(x=>x.join(',')).join('\n')}
function putBackCsv(){const r=[['test','food','date','round','time','side','side_name','uv_glow','white_brightness','fruit_gray_uv','fruit_gray_white','highlighter_gray','gray_swatch_gray','fruit_points']];
  S.tests.forEach(t=>t.rounds.forEach((rd,i)=>rd.sides.forEach((s,j)=>r.push([cell(t.label),t.food,t.date,i+1,rd.time,j+1,cell(s.view||''),s.glow.toFixed(5),s.look.toFixed(5),s.fruitUV.toFixed(2),s.fruitW.toFixed(2),s.E.toFixed(2),s.B.toFixed(2),s.n]))));return r.map(x=>x.join(',')).join('\n')}
function dl(text,name){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}}
function vData(){
  const w=S.settings.err,L=S.settings.lead,nScans=S.items.reduce((a,i)=>a+i.scans.length,0);
  app.innerHTML=`<h1>Your data stays on this phone</h1><p class="mute">No account, no sign-in, no server. Nothing leaves the phone unless you export it.</p>
  <div class="card"><b>What is saved</b><div class="chk"><span>Items</span><span class="num">${S.items.length}</span></div><div class="chk"><span>Scans</span><span class="num">${nScans}</span></div><div class="chk"><span>Put-back tests</span><span class="num">${S.tests.length}</span></div><div class="chk"><span>Photos</span><span>Kept on this phone only</span></div><div class="chk"><span>Name, email, location</span><span>Never collected</span></div></div>
  <h2>Photos</h2>
  <div class="card"><div class="seg" style="grid-template-columns:1fr 1fr"><button data-pm="research" class="${S.settings.photoMode==='research'?'on':''}">Research</button><button data-pm="everyday" class="${S.settings.photoMode==='everyday'?'on':''}">Everyday</button></div>
   <p class="small" style="margin-top:10px">${S.settings.photoMode==='research'?'<b>Research mode:</b> every UV and white photo of every side is kept at full quality with a standard name (Day03_T4_S2_UV.jpg). Export each day and copy the zip to your computer or Google Drive.':'<b>Everyday mode:</b> small previews are kept. Open History to save a full photo.'}</p>
   ${S.settings.photoMode==='everyday'?`<label class="cb"><input type="checkbox" id="kf" ${S.settings.keepFull?'checked':''}> Keep full photos in the app too</label>`:''}
   <div id="phStats" class="small mute" style="margin-top:6px">Counting photos…</div></div>
  <div class="grid2"><button class="btn alt" id="exT">Export today</button><button class="btn alt" id="exN">Export all new</button></div>
  <button class="btn alt" id="blind" style="margin-top:8px">Blind scoring pack (side 1 white photos)</button>
  <button class="btn danger" id="delEx" style="margin-top:8px">Free up space: delete exported photos</button>
  <p class="small" id="phMsg"></p>
  <h2>Numbers</h2><div class="grid2"><button class="btn alt" id="dlc">Download scans CSV</button><button class="btn alt" id="dlw">Download put-back CSV</button></div><button class="btn alt" id="cp" style="margin-top:8px">Copy scans CSV</button><p class="small mute" id="cpMsg"></p>
  <label class="f" for="imp">Restore: paste a FreshLight scans CSV</label><textarea id="imp" placeholder="label,food,example,date,…"></textarea><button class="btn alt" id="im" style="margin-top:8px">Restore from pasted CSV</button>
  <h2>Method settings</h2><p class="small mute">Measuring errors start as placeholders. The put-back test fills them in. Days-left (lead time) comes from the build batch. Freeze these before the blind batch.</p>
  <div class="card"><b>Sides per scan</b><p class="small mute">Set by the put-back test. 4 = rolled a quarter turn each time; 2 = rolled half a turn (the comparison).</p>${['tomato','strawberry'].map(f=>`<label class="f">${FOODS[f].name}</label><div class="seg">${VIEW_OPTS[f].map(k=>`<button data-sd="${f}:${k}" class="${viewsFor(f)===k?'on':''}">${k}</button>`).join('')}</div>`).join('')}</div>
  ${['tomato','strawberry'].map(f=>`<div class="card"><b>${FOODS[f].name}</b>${S.settings.errSource[f]?`<p class="small mute">From put-back test ${esc(S.settings.errSource[f])}</p>`:'<p class="small mute">Placeholder values</p>'}<div class="grid2"><div><label class="f" for="wg_${f}">UV measuring error %</label><input type="number" step="0.1" id="wg_${f}" value="${w[f].glow}"></div><div><label class="f" for="wl_${f}">White measuring error %</label><input type="number" step="0.1" id="wl_${f}" value="${w[f].look}"></div></div><label class="f" for="ld_${f}">Days left after first real change (lead time)</label><input type="number" step="1" id="ld_${f}" value="${L[f]}"></div>`).join('')}
  <button class="btn" id="sv">Save settings</button>
  <h2>Reset</h2><div class="grid2"><button class="btn alt" id="dm">Reload example items</button><button class="btn danger" id="wipe">Delete all data</button></div>`;
  on('dlc',()=>{$('#cpMsg').textContent=dl(csv(),'freshlight-scans-'+ds(today())+'.csv')?'Download started. If nothing happens here, use Copy.':'Downloads are blocked here. Use Copy.'});
  on('dlw',()=>{$('#cpMsg').textContent=dl(putBackCsv(),'freshlight-putback-'+ds(today())+'.csv')?'Download started.':'Downloads are blocked here.'});
  on('cp',async()=>{try{await navigator.clipboard.writeText(csv());$('#cpMsg').textContent='Copied. Paste it into a note or Google Sheets.'}catch(e){$('#cpMsg').textContent='Copy was blocked. Select the text in the restore box instead.';$('#imp').value=csv()}});
  on('im',()=>{const t=$('#imp').value.trim().split(/\r?\n/);if(t.length<2){$('#cpMsg').textContent='Paste a CSV first.';return}const items={};
    t.slice(1).forEach(l=>{const[label,food,ex,date,day,views,glow,look]=l.split(',');if(!label||!FOODS[food]||isNaN(+glow))return;const k=label+'|'+food;items[k]=items[k]||{id:'r'+Object.keys(items).length+Date.now(),label,food,demo:ex==='1',day0:date,scans:[]};items[k].scans.push({date,day:+day,glow:+glow,look:+look,sides:[]})});
    const arr=Object.values(items);if(!arr.length){$('#cpMsg').textContent='No FreshLight rows found.';return}arr.forEach(i=>i.day0=i.scans[0].date);S.items=arr;save();$('#cpMsg').textContent='Restored '+arr.length+' items.'});
  app.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{S.settings.photoMode=b.dataset.pm;save();vData()});
  app.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{const[f,k]=b.dataset.sd.split(':');S.settings.views[f]=+k;save();vData()});
  on('kf',()=>{S.settings.keepFull=$('#kf').checked;save()});
  (async()=>{const ph=await allPhotos(),full=ph.filter(p=>p.blob),nw=full.filter(p=>!p.exported);let est='';try{const e=await navigator.storage.estimate();est=' · app storage '+fmtMB(e.usage||0)+' of '+fmtMB(e.quota||0)}catch(e){}
    const el=$('#phStats');if(el)el.textContent=ph.length+' photos ('+full.length+' full, '+(ph.length-full.length)+' previews) · '+nw.length+' not exported yet'+est})();
  on('exT',async()=>{const t=ds(today());exportZip((await allPhotos()).filter(p=>p.blob&&p.date===t),'FreshLight_'+t+'.zip',$('#phMsg'))});
  on('exN',async()=>{exportZip((await allPhotos()).filter(p=>p.blob&&!p.exported),'FreshLight_new_'+ds(today())+'.zip',$('#phMsg'))});
  on('blind',()=>sheet(`<h2>Blind scoring pack</h2><p class="mute">The side 1 white-light photo of each fruit-day is shuffled and renamed with a random code, with a scoring sheet and the 0–4 rubric. The answer key is a separate file. Put-back test photos are left out.</p><button class="btn" id="bT">Today's photos</button><button class="btn alt" id="bA" style="margin-top:8px">All photos</button><button class="btn alt" id="cl" style="margin-top:8px">Cancel</button>`,(d,close)=>{
    const run=async all=>{close();const t=ds(today());blindPack((await allPhotos()).filter(p=>p.blob&&p.kind==='W'&&(p.side||1)===1&&S.items.some(i=>i.id===p.itemId)&&(all||p.date===t)),$('#phMsg'))};
    d.querySelector('#bT').onclick=()=>run(false);d.querySelector('#bA').onclick=()=>run(true);d.querySelector('#cl').onclick=close}));
  on('delEx',()=>sheet(`<h2>Delete exported photos?</h2><p class="mute">Full photos you have already exported are removed from the app. Previews and all numbers stay. Only do this after the zip is safely on your computer or Google Drive.</p><div class="grid2"><button class="btn alt" id="no">Cancel</button><button class="btn danger" id="yes">Delete</button></div>`,(d,close)=>{d.querySelector('#no').onclick=close;
    d.querySelector('#yes').onclick=async()=>{const ex=(await allPhotos()).filter(p=>p.blob&&p.exported);await putPhotos(ex.map(p=>Object.assign(p,{blob:null})));close();vData();$('#phMsg').textContent=ex.length+' full photos removed; previews kept.'}}));
  on('sv',()=>{['tomato','strawberry'].forEach(f=>{const g=id=>+$('#'+id).value;if(g('wg_'+f)>0)w[f].glow=g('wg_'+f);if(g('wl_'+f)>0)w[f].look=g('wl_'+f);if(g('ld_'+f)>=0)L[f]=g('ld_'+f)});save();$('#sv').textContent='Saved'});
  on('dm',()=>{S.items=S.items.filter(i=>!i.demo).concat(demoItems());save();$('#dm').textContent='Example items loaded'});
  on('wipe',()=>sheet(`<h2>Delete everything?</h2><p class="mute">All items, scans, put-back tests, photos, setup and settings will be removed from this phone. Export first if you need them.</p><div class="grid2"><button class="btn alt" id="no">Cancel</button><button class="btn danger" id="yes">Delete all</button></div>`,(d,close)=>{d.querySelector('#no').onclick=close;d.querySelector('#yes').onclick=async()=>{await clearPhotos();S=fresh();S.items=[];save();close();stack=[];go('home',{},false)}}));
  setDock('');
}

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
cam.mode=(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.isSecureContext)?'unknown':'photo';
render();
}
