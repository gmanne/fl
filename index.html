<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A33C9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FreshLight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>FreshLight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm lab instrument in your pocket; one clear instruction per screen.
   IDEA: a field scanner's display — big status, the numbers behind it, nothing hidden.
   PICTURE: the live camera view with the measuring boxes drawn on it.
   COLOUR and TYPE: pale ground, ink, violet accent (UV), green/amber/red status; IBM Plex Sans + Mono for numbers.
   LAYOUT: one column, sticky top bar, big bottom action button within thumb reach. */
:root{color-scheme:light dark;
--bg:light-dark(#F5F6F2,#101512);--card:light-dark(#FFFFFF,#18201B);--ink:light-dark(#17211C,#E9EEE9);--mute:light-dark(#4F5B54,#A9B4AD);
--line:light-dark(#D9DDD6,#2C3630);--acc:#4A33C9;--acc2:light-dark(#4A33C9,#9C8BFF);--accbg:light-dark(#EFECFF,#251F4A);
--ok:light-dark(#1E7A4C,#5FD39A);--okbg:light-dark(#DDF0E4,#163325);--warn:light-dark(#8A5300,#F2B24C);--warnbg:light-dark(#FCEFD6,#3A2A0E);
--bad:light-dark(#A3231B,#FF8A80);--badbg:light-dark(#FBE3DE,#3D1714);--soft:light-dark(#E7EAE3,#222B25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--acc);color:#fff}
.bar .brand{font-weight:700;font-size:18px;flex:1}
.bar button{background:none;border:0;color:#fff;font:600 26px/1 system-ui,sans-serif;width:44px;height:44px;border-radius:10px;cursor:pointer}
.bar button:focus-visible{outline:2px solid #fff}
.chip{font:600 12px 'IBM Plex Sans',system-ui,sans-serif;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:28px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
h2{font-size:18px;margin:18px 0 8px}
p{margin:6px 0}.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.kpi b{display:block;font-size:24px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;color:inherit;font:inherit;cursor:pointer;min-height:64px}
.av{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font:600 14px 'IBM Plex Mono';background:var(--badbg);color:var(--bad);flex:none}
.st{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.fresh{background:var(--okbg);color:var(--ok)}.st.soon{background:var(--warnbg);color:var(--warn)}.st.past{background:var(--badbg);color:var(--bad)}.st.day0,.st.changed{background:var(--accbg);color:var(--acc2)}
.demo{font:600 11px 'IBM Plex Sans',system-ui,sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:600 16px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer;padding:0 16px}
.btn.alt{background:var(--card);color:var(--acc2);border:1.5px solid var(--acc2)}.btn.danger{background:var(--card);color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45}.btn:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%)}
.dock .in{max-width:560px;margin:0 auto;display:grid;gap:8px}.two{grid-template-columns:1fr 1fr}
.steps{display:flex;gap:6px;margin:8px 0 4px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--soft)}.steps i.on{background:var(--acc2)}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#0B100D;border-radius:16px;overflow:hidden;margin:10px 0}
.cam video,.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.ov{position:absolute;inset:0;pointer-events:none}
.roi{position:absolute;border:2px dashed #fff;border-radius:4px}.roi.food{border-color:#B9AEFF}.roi.cur{border:3px solid #FFE14D}
.roi span{position:absolute;left:-2px;top:-22px;font:600 11px 'IBM Plex Sans',system-ui,sans-serif;background:rgba(0,0,0,.65);color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap}
.camMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#E4F1E8;padding:20px;font-size:14px}
.chk{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.chk:last-child{border:0}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}.na{color:var(--mute)}
.big{border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;margin:12px 0}
.big b{font-size:30px;letter-spacing:.02em;display:block;line-height:1.1}
.big.fresh{background:var(--okbg);color:var(--ok)}.big.soon{background:var(--warnbg);color:var(--warn)}.big.past{background:var(--badbg);color:var(--bad)}.big.day0,.big.changed{background:var(--accbg);color:var(--acc2)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--soft);margin:10px 0 4px}.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}.meter s{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
.num{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}
.list li{margin:8px 0}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number],select,textarea{width:100%;font:16px 'IBM Plex Sans',system-ui,sans-serif;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
textarea{min-height:120px;font-family:'IBM Plex Mono';font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer}
.seg button.on{border-color:var(--acc2);background:var(--accbg);color:var(--acc2)}
.note{background:var(--accbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.note.w{background:var(--warnbg)}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumbs img{width:100%;border-radius:10px;display:block;background:#0B100D;aspect-ratio:4/3;object-fit:cover}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:grid;align-items:end}
.sheet .in{background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);max-width:560px;width:100%;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>
</head>
<body>
<header class="bar"><button id="back" aria-label="Back" hidden>‹</button><div class="brand" id="ttl">FreshLight</div><span class="chip" id="mode">Checking camera…</span></header>
<main id="app"></main>
<div class="dock" id="dock"></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<script>
{
const $=s=>document.querySelector(s), app=$('#app'), dock=$('#dock');
const KEY='freshlight-v1';
const FOODS={tomato:{name:'Tomato',code:'T'},strawberry:{name:'Strawberry',code:'S'},other:{name:'Other',code:'P'}};
const ROIS0={food:{x:.42,y:.5,s:.2},A:{x:.8,y:.3,s:.05},B:{x:.8,y:.42,s:.05},C:{x:.8,y:.54,s:.05},D:{x:.8,y:.66,s:.05}};
const ROI_NAME={food:'Food',A:'A black',B:'B gray',C:'C white',D:'D paper'};
const clone=o=>JSON.parse(JSON.stringify(o)), sleep=ms=>new Promise(r=>setTimeout(r,ms)), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const nice=s=>pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});

/* ---------- data ---------- */
function demoItems(){
  const mk=(id,label,food,ago,pts)=>{const d0=addDays(today(),-ago),b=food==='tomato'?{uv:.4,color:1.8}:{uv:.62,color:2.4};
    return {id,label,food,demo:true,day0:ds(d0),scans:pts.map(([day,u,c])=>({date:ds(addDays(d0,day)),day,uv:b.uv*(1+u/100),color:b.color*(1+c/100),leak:.03,dLvl:180}))}};
  return [mk('d1','T1','tomato',6,[[0,0,0],[1,1.2,.6],[2,2.5,1.1],[3,4,1.8],[4,5.1,2.4],[5,6.6,3.3],[6,9.1,3.8]]),
          mk('d2','S1','strawberry',2,[[0,0,0],[1,2,1],[2,3.5,1.5]]),
          mk('d3','S2','strawberry',4,[[0,0,0],[1,4,1.5],[2,9,4.5],[3,14,6],[4,19,8.5]]),
          mk('d4','T2','tomato',1,[[0,0,0],[1,.8,.4]])];
}
function fresh(){return {v:1,settings:{cameraId:'',presets:{},rois:clone(ROIS0),noise:{tomato:{uv:6,color:3},strawberry:{uv:8,color:4},other:{uv:8,color:4}},lead:{tomato:3,strawberry:2},baseD:null,setupDone:false},items:demoItems()}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1)return j}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function evalItem(it){
  const N=S.settings.noise[it.food]||S.settings.noise.other, L=S.settings.lead[it.food], b=it.scans[0];let det=null;
  it.scans.forEach((sc,i)=>{sc.dUV=(sc.uv-b.uv)/b.uv*100;sc.dCol=(sc.color-b.color)/b.color*100;sc.nUV=Math.abs(sc.dUV)/N.uv;sc.nCol=Math.abs(sc.dCol)/N.color;sc.fi=(sc.nUV+sc.nCol)/2;if(det===null&&i>0&&sc.fi>=1)det=sc.day});
  const last=it.scans[it.scans.length-1];let status,label,detail,left=null;
  if(it.scans.length===1){status='day0';label='Day 0 saved';detail='Scan again tomorrow to see a change'}
  else if(det===null){status='fresh';label='Fresh';detail='No real change since Day 0'}
  else if(L==null){status='changed';label='Changed';detail='Real change since Day '+det+'. No days-left prediction for this food yet'}
  else{left=L-(last.day-det);if(left<=0){status='past';label='Past best';detail='Use today or compost'}else{status='soon';label='Use soon';detail='About '+left+' day'+(left>1?'s':'')+' left · changing since Day '+det}}
  return {status,label,detail,left,det,last,N,L};
}

/* ---------- camera ---------- */
const cam={track:null,caps:{},mode:'unknown',err:''};
const box=document.createElement('div');box.className='cam';
box.innerHTML='<video playsinline muted autoplay></video><img alt="Captured photo" hidden><div class="ov"></div><div class="camMsg"></div>';
const video=box.querySelector('video'),still=box.querySelector('img'),ov=box.querySelector('.ov'),msg=box.querySelector('.camMsg');
let curRoi=null,frameWH=[4,3];
function fitBox(w,h){if(w&&h){frameWH=[w,h];box.style.aspectRatio=w+'/'+h}drawOv()}
function drawOv(){const R=S.settings.rois,[W,H]=frameWH;ov.innerHTML=Object.keys(R).map(k=>{const r=R[k],hw=r.s/2,hh=r.s/2*W/H;
  return `<div class="roi ${k==='food'?'food':''} ${curRoi===k?'cur':''}" style="left:${(r.x-hw)*100}%;top:${(r.y-hh)*100}%;width:${r.s*100}%;height:${r.s*W/H*100}%"><span>${ROI_NAME[k]}</span></div>`}).join('')}
box.addEventListener('click',e=>{if(!curRoi)return;const b=box.getBoundingClientRect();const r=S.settings.rois[curRoi];r.x=clamp((e.clientX-b.left)/b.width,.02,.98);r.y=clamp((e.clientY-b.top)/b.height,.02,.98);save();drawOv();if(onMark)onMark()});
let onMark=null;
function stopCam(){if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}cam.track=null}
async function startCam(retry){
  msg.textContent='Starting camera…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){cam.mode='photo';cam.err='Live camera not available here';setMode();msg.textContent='';return false}
  try{stopCam();const id=S.settings.cameraId;const c={audio:false,video:{width:{ideal:1920},height:{ideal:1440}}};
    if(id)c.video.deviceId={exact:id};else c.video.facingMode={ideal:'environment'};
    const st=await navigator.mediaDevices.getUserMedia(c);cam.track=st.getVideoTracks()[0];cam.caps=cam.track.getCapabilities?cam.track.getCapabilities():{};
    video.srcObject=st;video.hidden=false;still.hidden=true;await video.play().catch(()=>{});
    await new Promise(r=>{if(video.videoWidth)return r();video.onloadedmetadata=r;setTimeout(r,2500)});
    cam.mode='live';msg.textContent='';fitBox(video.videoWidth,video.videoHeight);setMode();return true}
  catch(e){if(S.settings.cameraId&&!retry){S.settings.cameraId='';save();return startCam(true)}
    cam.mode='photo';cam.err=e.name==='NotAllowedError'?'Camera permission was blocked':'Live camera not available here';msg.textContent='';setMode();return false}
}
async function backCams(){try{const d=await navigator.mediaDevices.enumerateDevices();return d.filter(x=>x.kind==='videoinput')}catch(e){return[]}}
function setMode(){const m=$('#mode');m.textContent=cam.mode==='live'?'Live camera':cam.mode==='photo'?'Photo mode':'';m.hidden=!m.textContent}
function measure(ctx,W,H){const out={},R=S.settings.rois;for(const k in R){const r=R[k],half=Math.max(2,Math.round(r.s*W/2)),cx=Math.round(r.x*W),cy=Math.round(r.y*H);
  const x0=clamp(cx-half,0,W-2),y0=clamp(cy-half,0,H-2),w=Math.max(1,Math.min(2*half,W-x0)),h=Math.max(1,Math.min(2*half,H-y0));
  const d=ctx.getImageData(x0,y0,w,h).data;let a=0,g=0,b=0;const n=d.length/4;for(let i=0;i<d.length;i+=4){a+=d[i];g+=d[i+1];b+=d[i+2]}out[k]=[a/n,g/n,b/n]}return out}
function thumbOf(cv){const t=document.createElement('canvas');t.width=320;t.height=Math.round(320*cv.height/cv.width);t.getContext('2d').drawImage(cv,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}
async function grab(n=8){const W=video.videoWidth,H=video.videoHeight,cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d',{willReadFrequently:true});const acc={};
  for(let i=0;i<n;i++){ctx.drawImage(video,0,0,W,H);const m=measure(ctx,W,H);for(const k in m){acc[k]=acc[k]||[0,0,0];for(let j=0;j<3;j++)acc[k][j]+=m[k][j]/n}await sleep(90)}
  return {m:acc,thumb:thumbOf(cv)}}
function pickPhoto(){return new Promise(res=>{const f=$('#file');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return res(null);const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);
    still.src=url;still.hidden=false;video.hidden=true;fitBox(cv.width,cv.height);res({m:measure(ctx,cv.width,cv.height),thumb:thumbOf(cv)})};im.onerror=()=>res(null);im.src=url};f.click()})}
const fmtExp=e=>{const s=e*1e-4;return s>=1?s.toFixed(1)+' s':'1/'+Math.round(1/s)+' s'};
async function applyPreset(p){if(!cam.track||!p)return;try{await cam.track.applyConstraints({advanced:[p]})}catch(e){}}
async function lockPreset(kind){
  const t=cam.track,c=cam.caps||{};const rep={};if(!t)return null;const auto={};
  if((c.exposureMode||[]).includes('continuous'))auto.exposureMode='continuous';if((c.whiteBalanceMode||[]).includes('continuous'))auto.whiteBalanceMode='continuous';if((c.focusMode||[]).includes('continuous'))auto.focusMode='continuous';
  try{if(Object.keys(auto).length)await t.applyConstraints({advanced:[auto]})}catch(e){}
  await sleep(2500);const s=t.getSettings?t.getSettings():{},p={};
  if((c.exposureMode||[]).includes('manual')&&c.exposureTime&&s.exposureTime){p.exposureMode='manual';p.exposureTime=s.exposureTime;rep.exposure='Locked · '+fmtExp(s.exposureTime)}else rep.exposure='Auto · this phone does not allow locking';
  if(p.exposureMode&&c.iso&&s.iso){p.iso=s.iso;rep.iso='Locked · ISO '+Math.round(s.iso)}else rep.iso='Auto';
  if((c.whiteBalanceMode||[]).includes('manual')&&c.colorTemperature){p.whiteBalanceMode='manual';p.colorTemperature=s.colorTemperature||clamp(5000,c.colorTemperature.min,c.colorTemperature.max);rep.wb='Locked · '+Math.round(p.colorTemperature)+' K'}else rep.wb='Auto · corrected with gray patch B';
  if((c.focusMode||[]).includes('manual')&&c.focusDistance&&s.focusDistance!=null){p.focusMode='manual';p.focusDistance=s.focusDistance;rep.focus='Locked'}else rep.focus='Auto · fine, only averages are used';
  await applyPreset(p);S.settings.presets[kind]={p,rep};save();return rep}
const lum=a=>(a[0]+a[1]+a[2])/3;
function signals(food,u,w){const f=u.food,sum=f[0]+f[1]+f[2]||1,uv=food==='tomato'?f[1]/sum:f[2]/Math.max(1,u.D[2]);
  const color=(w.food[0]/Math.max(1,w.B[0]))/(Math.max(1,w.food[1])/Math.max(1,w.B[1]));
  return {uv,color,leak:lum(u.A)/Math.max(1,lum(u.D)),dLvl:lum(u.D),sat:Math.max(...w.C)}}
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}

/* ---------- navigation ---------- */
let view='home',stack=[],ctx={};
function go(v,c,push=true){if(push&&view!==v)stack.push([view,ctx]);view=v;ctx=c||{};curRoi=null;onMark=null;render();window.scrollTo(0,0)}
$('#back').onclick=()=>{const p=stack.pop();if(p){view=p[0];ctx=p[1];curRoi=null;onMark=null;render()}};
function setDock(html,two){dock.innerHTML=html?'<div class="in'+(two?' two':'')+'">'+html+'</div>':''}
function mountCam(){const slot=app.querySelector('[data-cam]');if(slot){slot.replaceWith(box);drawOv()}}
function on(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}
function render(){
  $('#back').hidden=view==='home';$('#ttl').textContent={home:'FreshLight',setup:'Setup',scan:'Scan',result:'Result',item:'History',data:'Your data',newitem:'New item'}[view]||'FreshLight';
  ({home:vHome,setup:vSetup,newitem:vNew,scan:vScan,result:vResult,item:vItem,data:vData})[view]();setMode();
}
function sheet(html,bind){const d=document.createElement('div');d.className='sheet';d.innerHTML='<div class="in">'+html+'</div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)d.remove()});bind(d,()=>d.remove())}

/* ---------- home ---------- */
function vHome(){
  const ev=S.items.map(it=>[it,evalItem(it)]),cnt=k=>ev.filter(x=>x[1].status===k).length;
  app.innerHTML=`<h1>My produce</h1><p class="mute">Scan each item once a day in the FreshLight box.</p>
  ${S.settings.setupDone?'':`<div class="note"><b>First time?</b> Run the one-time setup so the app knows your camera and where the food and card sit.</div>`}
  <div class="kpis"><div class="kpi"><b style="color:var(--ok)">${cnt('fresh')+cnt('day0')}</b><span class="small">Fresh</span></div><div class="kpi"><b style="color:var(--warn)">${cnt('soon')}</b><span class="small">Use soon</span></div><div class="kpi"><b style="color:var(--bad)">${cnt('past')}</b><span class="small">Past best</span></div></div>
  ${ev.length?ev.sort((a,b)=>({past:0,soon:1,changed:2,fresh:3,day0:4}[a[1].status]-{past:0,soon:1,changed:2,fresh:3,day0:4}[b[1].status])).map(([it,e])=>`<button class="item" data-id="${it.id}"><span class="av">${esc(it.label.slice(0,3))}</span><span class="grow"><b>${FOODS[it.food].name}</b>${it.demo?'<span class="demo">Example</span>':''}<br><span class="small mute">Day ${dayDiff(it.day0,ds(today()))} · last scan ${nice(e.last.date)}</span></span><span class="st ${e.status}">${e.label}</span></button>`).join(''):'<div class="card mute">No items yet. Add one to take its Day 0 scan.</div>'}
  <div class="grid2" style="margin-top:14px"><button class="btn alt" id="hSetup">Setup</button><button class="btn alt" id="hData">Your data</button></div>
  <p class="small mute" style="margin-top:14px">Items marked Example are made-up data so you can explore. History is saved only on this phone; there is no account.</p>`;
  app.querySelectorAll('.item').forEach(b=>b.onclick=()=>go('item',{id:b.dataset.id}));
  on('hSetup',()=>go('setup',{step:1}));on('hData',()=>go('data'));
  setDock(`<button class="btn" id="dNew">+ New item (Day 0 scan)</button>`);on('dNew',()=>S.settings.setupDone?go('newitem'):go('setup',{step:1}));
}

/* ---------- setup ---------- */
const SETUP_N=6;
function stepBar(n,N){return '<div class="steps">'+Array.from({length:N},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')+'</div>'}
async function vSetup(){
  const st=ctx.step||1;
  if(st===1){
    app.innerHTML=`${stepBar(1,SETUP_N)}<h1>Choose the main camera</h1><p class="mute">Use the 1x main lens every time. Other lenses (ultra-wide, zoom) see the food differently.</p><div data-cam></div><label class="f" for="camSel">Camera</label><select id="camSel"><option>Looking for cameras…</option></select><div id="camNote"></div>`;
    mountCam();const ok=await startCam();const sel=$('#camSel');if(!sel)return;
    if(ok){const cs=await backCams();sel.innerHTML=cs.map((c,i)=>`<option value="${esc(c.deviceId)}" ${c.deviceId===(cam.track.getSettings().deviceId)?'selected':''}>${esc(c.label||('Camera '+(i+1)))}</option>`).join('');
      sel.onchange=async()=>{S.settings.cameraId=sel.value;save();await startCam()};
      $('#camNote').innerHTML=`<div class="note small">Pick the plain back camera (on Samsung usually “camera 0, facing back”; on iPhone “Back Camera”, not Ultra Wide or Telephoto).</div>`;
      S.settings.cameraId=cam.track.getSettings().deviceId||'';save()}
    else{sel.disabled=true;sel.innerHTML='<option>Phone camera (photo mode)</option>';$('#camNote').innerHTML=`<div class="note w small"><b>${esc(cam.err)}.</b> The app will open the phone's camera for each photo instead. Settings cannot be locked in this mode, so open the installed FreshLight app for real data.</div>`;msg.textContent='Photo mode: you will take photos with the button on each step'}
    setDock(`<button class="btn" id="n">Next</button>`);on('n',()=>go('setup',{step:2},false));
  }
  if(st===2){
    app.innerHTML=`${stepBar(2,SETUP_N)}<h1>Set up the box</h1><ol class="list"><li>Plug the light into the wall charger.</li><li>Lay the phone screen-up with the edge nearest its main lens toward the light.</li><li>Slide the phone until the food spot is in the middle of the view below, then set the two fences.</li><li>Clip the reference card on the bridge at the measuring plane.</li><li>Slide the empty tray in and close the flap.</li></ol><div data-cam></div>`;
    mountCam();if(cam.mode==='live'&&!cam.track)await startCam();
    setDock(`<button class="btn" id="n">The box is ready</button>`);on('n',()=>go('setup',{step:3},false));
  }
  if(st===3){
    const order=['food','A','B','C','D'];let i=ctx.i||0;
    const paint=()=>{curRoi=order[i];drawOv();const t=$('#markT');if(t)t.innerHTML=`Tap the middle of <b>${i===0?'the food':'patch '+ROI_NAME[order[i]]}</b> on the picture (${i+1} of 5).`};
    app.innerHTML=`${stepBar(3,SETUP_N)}<h1>Mark the food and the card</h1><p class="mute">Put a tomato in the tray and switch WHITE on. Boxes stay in the same place every day, because the tray and card do.</p><p id="markT"></p><div data-cam></div>${cam.mode==='photo'?'<button class="btn alt" id="snap">Take a photo to mark on</button>':''}`;
    mountCam();paint();onMark=()=>{if(i<order.length-1){i++;ctx.i=i;paint()}else{curRoi=null;drawOv();$('#markT').innerHTML='All five boxes are set. Tap any box name again by redoing this step if one is off.'}};
    on('snap',async()=>{await pickPhoto()});
    setDock(`<button class="btn" id="n">Boxes look right</button>`);on('n',()=>{curRoi=null;go('setup',{step:4},false)});
  }
  if(st===4||st===5){
    const kind=st===4?'uv':'white',isUV=st===4,pr=S.settings.presets[kind];
    app.innerHTML=`${stepBar(st,SETUP_N)}<h1>Lock the ${isUV?'UV':'white-light'} camera settings</h1><p class="mute">${isUV?'Switch WHITE off. Hold the UV switch for half a second to turn UV on. Keep the tray closed.':'Switch UV off. Hold the WHITE switch to turn it on, at the level you will always use (for example Low).'}</p><div data-cam></div>
    <div class="card" id="rep">${pr?repHtml(pr.rep):'<p class="mute small">The app lets the camera adjust for 2.5 seconds, then freezes exposure, ISO, white balance and focus where the phone allows it.</p>'}</div>`;
    mountCam();
    setDock(`<button class="btn alt" id="lk">${pr?'Lock again':'Lock settings'}</button><button class="btn" id="n" ${pr||cam.mode!=='live'?'':'disabled'}>Next</button>`,true);
    on('lk',async()=>{const b=$('#lk');if(cam.mode!=='live'){$('#rep').innerHTML='<p class="small">Photo mode: the phone sets these itself. The reference card corrects brightness and gray patch B corrects color.</p>';$('#n').disabled=false;return}
      b.disabled=true;b.textContent='Adjusting…';b.classList.add('pulse');const rep=await lockPreset(kind);
      if(isUV){await sleep(400);const g=await grab(4);S.settings.baseD=lum(g.m.D);save()}
      b.classList.remove('pulse');b.disabled=false;b.textContent='Lock again';$('#rep').innerHTML=repHtml(rep);$('#n').disabled=false});
    on('n',()=>go('setup',{step:st+1},false));
  }
  if(st===6){
    S.settings.setupDone=true;save();
    app.innerHTML=`${stepBar(6,SETUP_N)}<h1>Setup done</h1><p>Your camera, its locked settings and the five measuring boxes are saved on this phone.</p><div class="card">${['uv','white'].map(k=>S.settings.presets[k]?`<b>${k==='uv'?'UV':'White'}</b>${repHtml(S.settings.presets[k].rep)}`:'').join('')||'<p class="small mute">Photo mode: no camera settings saved.</p>'}</div><p class="small mute">Run setup again if you change phones, move the fences or the box.</p>`;
    setDock(`<button class="btn" id="n">Start scanning</button>`);on('n',()=>{stack=[];go('home',{},false)});
  }
}
function repHtml(r){return [['Exposure',r.exposure],['ISO',r.iso],['White balance',r.wb],['Focus',r.focus]].map(([a,b])=>`<div class="chk"><span>${a}</span><span class="${/^Locked/.test(b)?'pass':'na'}">${esc(b)}</span></div>`).join('')}

/* ---------- new item ---------- */
function vNew(){
  const food=ctx.food||'tomato',n=S.items.filter(i=>i.food===food).length+1;
  app.innerHTML=`<h1>New item</h1><p class="mute">Today's scan becomes this item's Day 0. Put a numbered sticker on it so you always rescan the same one.</p>
  <label class="f">Food</label><div class="seg">${Object.keys(FOODS).map(k=>`<button data-f="${k}" class="${k===food?'on':''}">${FOODS[k].name}</button>`).join('')}</div>
  ${food==='other'?'<div class="note w small">Untested food: the app will show change since Day 0, but no days-left prediction.</div>':''}
  <label class="f" for="lbl">Sticker label</label><input type="text" id="lbl" maxlength="8" value="${FOODS[food].code}${n}">`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ctx.food=b.dataset.f;vNew()});
  setDock(`<button class="btn" id="n">Take Day 0 scan</button>`);
  on('n',()=>{const lbl=($('#lbl').value||'').trim()||FOODS[food].code+n;go('scan',{newItem:{label:lbl,food},step:1})});
}

/* ---------- scan ---------- */
function vScan(){
  const it=ctx.id?S.items.find(i=>i.id===ctx.id):null,food=it?it.food:ctx.newItem.food,label=it?it.label:ctx.newItem.label,st=ctx.step||1;wake();
  const head=`${stepBar(st,4)}<p class="small mute">${esc(label)} · ${FOODS[food].name}${it?' · Day '+dayDiff(it.day0,ds(today())):' · Day 0'}</p>`;
  if(st===1){
    app.innerHTML=`${head}<h1>Load the tray</h1><ol class="list"><li>Put ${esc(label)} on its insert, stem side down.</li><li>Add spacers until its top just touches the bridge feeler, then flip the feeler up.</li><li>Slide the tray in and close the flap. Both lights off.</li></ol><div data-cam></div>`;
    mountCam();if(cam.mode!=='photo'&&!cam.track)startCam();
    setDock(`<button class="btn" id="n">Tray is in</button>`);on('n',()=>{ctx.step=2;vScan()});
  }
  if(st===2||st===3){
    const isUV=st===2,kind=isUV?'uv':'white';
    app.innerHTML=`${head}<h1>${isUV?'UV photo':'White-light photo'}</h1><p>${isUV?'Hold the <b>UV</b> switch to turn UV on.':'Turn UV <b>off</b>, then hold the <b>WHITE</b> switch to turn white on.'} Don't touch the phone while it captures.</p><div data-cam></div><div id="res"></div>`;
    mountCam();if(cam.mode==='live')applyPreset((S.settings.presets[kind]||{}).p);
    setDock(`<button class="btn" id="cap">${cam.mode==='live'?'Capture':'Take photo'}</button>`);
    on('cap',async()=>{const b=$('#cap');b.disabled=true;let g;
      if(cam.mode==='live'){b.textContent='Hold still…';b.classList.add('pulse');await applyPreset((S.settings.presets[kind]||{}).p);await sleep(700);g=await grab(8)}else g=await pickPhoto();
      b.classList.remove('pulse');b.disabled=false;if(!g){b.textContent='Take photo';return}
      ctx[kind]=g;const m=g.m;let checks;
      if(isUV){const leak=lum(m.A)/Math.max(1,lum(m.D)),dL=lum(m.D),base=S.settings.baseD;
        checks=[['UV is on (paper D glows)',dL>25],['No light leak (patch A dark)',leak<.15],['UV level steady vs setup',base?Math.abs(dL-base)/base<.25:null]]}
      else{const sat=Math.max(...m.C);checks=[['White is on',lum(m.B)>40],['Not washed out (patch C)',sat<250]]}
      ctx[kind+'Checks']=checks;
      $('#res').innerHTML=`<div class="card">${checks.map(([t,ok])=>`<div class="chk"><span>${t}</span><span class="${ok===null?'na':ok?'pass':'fail'}">${ok===null?'—':ok?'Pass':'Check'}</span></div>`).join('')}</div>${checks.some(c=>c[1]===false)?'<p class="small" style="color:var(--bad)">Something looks off. Fix it and capture again, or continue anyway.</p>':''}`;
      b.textContent=cam.mode==='live'?'Capture again':'Retake';
      setDock(`<button class="btn alt" id="cap2">${cam.mode==='live'?'Capture again':'Retake'}</button><button class="btn" id="n">Next</button>`,true);
      on('cap2',()=>vScan());on('n',()=>{ctx.step=st+1;vScan()})});
  }
  if(st===4){
    app.innerHTML=`${head}<h1>Ready to analyze</h1><p>Turn the white light <b>off</b>. Take the item out and put it back in its container.</p><div class="thumbs"><img src="${ctx.uv.thumb}" alt="UV photo"><img src="${ctx.white.thumb}" alt="White-light photo"></div><p class="small mute">The photos are measured on this phone and then forgotten. Only four numbers are saved.</p>`;
    setDock(`<button class="btn" id="n">Analyze</button>`);
    on('n',()=>{const sg=signals(food,ctx.uv.m,ctx.white.m);let item=it;
      if(!item){item={id:'i'+Date.now(),label:ctx.newItem.label,food,demo:false,day0:ds(today()),scans:[]};S.items.push(item)}
      item.scans.push({date:ds(today()),day:dayDiff(item.day0,ds(today())),uv:sg.uv,color:sg.color,leak:sg.leak,dLvl:sg.dLvl});save();
      stack=[['home',{}]];go('result',{id:item.id,checks:[...(ctx.uvChecks||[]),...(ctx.whiteChecks||[])]},false)});
  }
}

/* ---------- result ---------- */
function vResult(){
  const it=S.items.find(i=>i.id===ctx.id);if(!it)return go('home',{},false);const e=evalItem(it),l=e.last;
  const pct=clamp(l.fi/3,0,1)*100,col={fresh:'var(--ok)',soon:'var(--warn)',past:'var(--bad)'}[e.status]||'var(--acc2)';
  const allOk=(ctx.checks||[]).every(c=>c[1]!==false);
  app.innerHTML=`<p class="small mute">${esc(it.label)} · ${FOODS[it.food].name} · Day ${l.day}</p>
  <div class="big ${e.status}"><div><b>${e.label.toUpperCase()}</b><span>${e.detail}</span></div></div>
  ${it.scans.length>1?`<div class="card"><div class="row"><b class="grow">FreshIndex</b><span class="num" style="font-size:24px">${l.fi.toFixed(2)}</span></div><div class="meter"><i style="width:${pct}%;background:${col}"></i><s style="left:33.3%"></s></div><div class="row small mute"><span class="grow">0 = no change</span><span>1 = real change</span><span class="grow" style="text-align:right">3</span></div></div>
  <div class="card"><b>Why</b>
   <div class="chk"><span>UV glow (${it.food==='tomato'?'green share':'blue ÷ paper D'})</span><span class="num">${l.dUV>=0?'+':''}${l.dUV.toFixed(1)}%</span></div><p class="small mute" style="margin:0 0 6px">Noise limit ±${e.N.uv}% → ${l.nUV.toFixed(2)} noise units</p>
   <div class="chk"><span>Color (red ÷ green, gray-corrected)</span><span class="num">${l.dCol>=0?'+':''}${l.dCol.toFixed(1)}%</span></div><p class="small mute" style="margin:0 0 6px">Noise limit ±${e.N.color}% → ${l.nCol.toFixed(2)} noise units</p>
   <p class="small">FreshIndex = (${l.nUV.toFixed(2)} + ${l.nCol.toFixed(2)}) ÷ 2 = ${l.fi.toFixed(2)}${e.L!=null?`. Days left uses a lead time of ${e.L} days after the first real change.`:'.'}</p></div>`:`<div class="card"><p>Day 0 numbers saved:</p><div class="chk"><span>UV glow</span><span class="num">${l.uv.toFixed(4)}</span></div><div class="chk"><span>Color</span><span class="num">${l.color.toFixed(4)}</span></div></div>`}
  <div class="card"><div class="chk"><span>Photo checks</span><span class="${allOk?'pass':'fail'}">${allOk?'All passed':'Some failed'}</span></div></div>
  <p class="small mute">${it.food==='other'?'Untested food: change only, no prediction.':'Tested on red-ripe tomatoes and strawberries at room temperature.'} A freshness screen, not a food-safety test.${it.demo?' This item uses example data.':''}</p>`;
  setDock(`<button class="btn alt" id="h">History</button><button class="btn" id="d">Done</button>`,true);
  on('h',()=>go('item',{id:it.id}));on('d',()=>{stack=[];go('home',{},false)});
}

/* ---------- item history ---------- */
function vItem(){
  const it=S.items.find(i=>i.id===ctx.id);if(!it)return go('home',{},false);const e=evalItem(it);
  app.innerHTML=`<h1>${esc(it.label)} · ${FOODS[it.food].name}${it.demo?'<span class="demo">Example</span>':''}</h1><p class="mute">Day 0 was ${nice(it.day0)} · ${it.scans.length} scan${it.scans.length>1?'s':''} · <span class="st ${e.status}">${e.label}</span></p>
  <div class="card"><b>FreshIndex by day</b><div class="fig" id="fig"><svg role="img" aria-label="FreshIndex by day"></svg></div></div>
  <div class="card"><table><thead><tr><th>Day</th><th>UV Δ</th><th>Color Δ</th><th>Index</th></tr></thead><tbody>${it.scans.map(s=>`<tr><td>${s.day} · ${nice(s.date)}</td><td class="num">${s.dUV.toFixed(1)}%</td><td class="num">${s.dCol.toFixed(1)}%</td><td class="num">${s.fi.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>
  ${e.det!=null?`<div class="card"><div class="chk"><span>First real change</span><b>Day ${e.det}</b></div>${e.L!=null?`<div class="chk"><span>Predicted past best</span><b>Day ${e.det+e.L}</b></div>`:''}</div>`:''}
  <button class="btn danger" id="del" style="margin-top:8px">Delete this item</button>`;
  const svg=$('#fig svg'),draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;const p=[34,12,24,10],mx=Math.max(1.6,...it.scans.map(s=>s.fi))*1.1,maxD=Math.max(1,...it.scans.map(s=>s.day));
    const X=d=>p[0]+(W-p[0]-p[1])*d/maxD,Y=v=>H-p[2]-(H-p[2]-p[3])*v/mx;
    svg.innerHTML=`<line x1="${p[0]}" x2="${W-p[1]}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${p[0]}" x2="${W-p[1]}" y1="${Y(1)}" y2="${Y(1)}" stroke="var(--warn)" stroke-dasharray="5 4"/><text x="${p[0]+4}" y="${Y(1)-6}" fill="var(--warn)" font-size="11">real change</text><text x="${p[0]-6}" y="${Y(0)+4}" text-anchor="end" font-size="11" fill="var(--mute)">0</text><text x="${p[0]-6}" y="${Y(1)+4}" text-anchor="end" font-size="11" fill="var(--mute)">1</text>
    <polyline fill="none" stroke="var(--acc2)" stroke-width="2.5" stroke-linejoin="round" points="${it.scans.map(s=>X(s.day)+','+Y(s.fi)).join(' ')}"/>${it.scans.map(s=>`<circle cx="${X(s.day)}" cy="${Y(s.fi)}" r="4.5" fill="${s.fi>=1?'var(--warn)':'var(--acc2)'}"/>`).join('')}
    ${it.scans.filter((s,i,a)=>W>420||i%Math.ceil(a.length/6)===0||i===a.length-1).map(s=>`<text x="${X(s.day)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mute)">D${s.day}</text>`).join('')}`};
  new ResizeObserver(draw).observe(svg);draw();
  on('del',()=>sheet(`<h2>Delete ${esc(it.label)}?</h2><p class="mute">Its history will be removed from this phone.</p><div class="grid2"><button class="btn alt" id="no">Cancel</button><button class="btn danger" id="yes">Delete</button></div>`,(d,close)=>{d.querySelector('#no').onclick=close;d.querySelector('#yes').onclick=()=>{S.items=S.items.filter(i=>i!==it);save();close();stack=[];go('home',{},false)}}));
  setDock(`<button class="btn" id="sc">Scan ${esc(it.label)} now</button>`);on('sc',()=>S.settings.setupDone?go('scan',{id:it.id,step:1}):go('setup',{step:1}));
}

/* ---------- data ---------- */
function csv(){const r=[['label','food','example','date','day','uv_signal','color_signal','uv_change_pct','color_change_pct','freshindex']];
  S.items.forEach(it=>{evalItem(it);it.scans.forEach(s=>r.push([it.label,it.food,it.demo?1:0,s.date,s.day,s.uv.toFixed(5),s.color.toFixed(5),s.dUV.toFixed(2),s.dCol.toFixed(2),s.fi.toFixed(3)]))});return r.map(x=>x.join(',')).join('\n')}
function vData(){
  const n=S.settings.noise,L=S.settings.lead,nScans=S.items.reduce((a,i)=>a+i.scans.length,0);
  app.innerHTML=`<h1>Your data stays on this phone</h1><p class="mute">No account, no sign-in, no server. Nothing leaves the phone unless you export it.</p>
  <div class="card"><b>What is saved</b><div class="chk"><span>Items</span><span class="num">${S.items.length}</span></div><div class="chk"><span>Scans (4 numbers each)</span><span class="num">${nScans}</span></div><div class="chk"><span>Photos</span><span>Never saved</span></div><div class="chk"><span>Name, email, location</span><span>Never collected</span></div></div>
  <h2>Backup</h2><div class="grid2"><button class="btn alt" id="dl">Download CSV</button><button class="btn alt" id="cp">Copy CSV</button></div><p class="small mute" id="cpMsg"></p>
  <label class="f" for="imp">Restore: paste a FreshLight CSV</label><textarea id="imp" placeholder="label,food,example,date,…"></textarea><button class="btn alt" id="im" style="margin-top:8px">Restore from pasted CSV</button>
  <h2>Calibration</h2><p class="small mute">These start as placeholders. Replace them with your Stage 0 noise limits (3 × CV) and your build-batch lead times.</p>
  ${['tomato','strawberry'].map(f=>`<div class="card"><b>${FOODS[f].name}</b><div class="grid2"><div><label class="f" for="nu_${f}">UV noise limit %</label><input type="number" step="0.1" id="nu_${f}" value="${n[f].uv}"></div><div><label class="f" for="nc_${f}">Color noise limit %</label><input type="number" step="0.1" id="nc_${f}" value="${n[f].color}"></div></div><label class="f" for="ld_${f}">Lead time, days</label><input type="number" step="1" id="ld_${f}" value="${L[f]}"></div>`).join('')}
  <button class="btn" id="sv">Save calibration</button>
  <h2>Reset</h2><div class="grid2"><button class="btn alt" id="dm">Reload example items</button><button class="btn danger" id="wipe">Delete all data</button></div>`;
  on('dl',()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv'}));a.download='freshlight-'+ds(today())+'.csv';document.body.appendChild(a);a.click();a.remove();$('#cpMsg').textContent='Download started. If nothing happens here, use Copy CSV.'}catch(e){$('#cpMsg').textContent='Downloads are blocked here. Use Copy CSV.'}});
  on('cp',async()=>{try{await navigator.clipboard.writeText(csv());$('#cpMsg').textContent='Copied. Paste it into a note or Google Sheets.'}catch(e){$('#cpMsg').textContent='Copy was blocked. Select the text in the restore box instead.';$('#imp').value=csv()}});
  on('im',()=>{const t=$('#imp').value.trim().split(/\r?\n/);if(t.length<2){$('#cpMsg').textContent='Paste a CSV first.';return}const items={};
    t.slice(1).forEach(l=>{const[label,food,ex,date,day,uv,color]=l.split(',');if(!label||!FOODS[food]||isNaN(+uv))return;const k=label+'|'+food;items[k]=items[k]||{id:'r'+Object.keys(items).length+Date.now(),label,food,demo:ex==='1',day0:date,scans:[]};items[k].scans.push({date,day:+day,uv:+uv,color:+color,leak:0,dLvl:0})});
    const arr=Object.values(items);if(!arr.length){$('#cpMsg').textContent='No FreshLight rows found.';return}arr.forEach(i=>i.day0=i.scans[0].date);S.items=arr;save();$('#cpMsg').textContent='Restored '+arr.length+' items.'});
  on('sv',()=>{['tomato','strawberry'].forEach(f=>{const g=id=>+$('#'+id).value;if(g('nu_'+f)>0)n[f].uv=g('nu_'+f);if(g('nc_'+f)>0)n[f].color=g('nc_'+f);if(g('ld_'+f)>=0)L[f]=g('ld_'+f)});save();$('#sv').textContent='Saved'});
  on('dm',()=>{S.items=S.items.filter(i=>!i.demo).concat(demoItems());save();$('#dm').textContent='Example items loaded'});
  on('wipe',()=>sheet(`<h2>Delete everything?</h2><p class="mute">All items, scans, setup and calibration will be removed from this phone. Export a backup first if you need it.</p><div class="grid2"><button class="btn alt" id="no">Cancel</button><button class="btn danger" id="yes">Delete all</button></div>`,(d,close)=>{d.querySelector('#no').onclick=close;d.querySelector('#yes').onclick=()=>{S=fresh();S.items=[];save();close();stack=[];go('home',{},false)}}));
  setDock('');
}

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
cam.mode=(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.isSecureContext)?'unknown':'photo';
render();
}
</script>
</body>
</html>
